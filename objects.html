<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
    <style>
      *{
        padding: 0;
        margin: 0;
        box-sizing: border-box; 
        font-family: sans-serif;
      }
      body{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(56deg,rgba(111, 111, 242, 0.477) 50%,rgba(113, 255, 255, 0.378) 50%);
      }
      .profile{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: #fff;
        height: 500px;
        border-radius: 7px;
        gap: 30px;
        box-shadow: 0 0 12px black;
      }
      .pro-info{
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .pro-info h1{
        font-size: 35px;
        color: rgb(11, 11, 137);
      }
      .pro-info p{
        font-size: 18px;
        font-weight: bold;
        color: rgba(0, 0, 0, 0.389);
      }
      .card{
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .card h2{
        font-size: 22px;
        display: flex;
        width: 100%;
    position: relative;
     color: blue;
      }
      .cre{
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }
      .cre input{
        padding: 10px;
        width: 350px;
        border: 2px solid rgba(37, 37, 75, 0.392);
        border-radius: 5px;
        font-size: 18px;
        font-weight: bold;
      }
     .buttons{
        display: flex;
        gap: 30px;
     }
     .buttons button{
        padding: 15px 30px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
     }
     .create{
        background: rgb(8, 8, 139);
        color: #fff;
     }
     .clear{
        background: rgba(0, 0, 255, 0.248);
     }
     .create:hover{
        background: blue;
     }
     .clear:hover{
        background: #9a9b9e57;
     }
     .cardshow{
        position: absolute;
        background: #fff;
        padding: 20px;
        width: 520px;
        height: 600px;
        border-radius: 6px;
        box-shadow: 0 0 12px;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        background: linear-gradient(50deg,rgb(255, 179, 0),rgb(0, 145, 255));
        justify-content: center;
     }
     .per{
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: center;
     }
     .per h1{
        font-size: 50px;
        color: rgb(145, 15, 159);
     }
     .per h2{
        font-family: cursive;
     }
     .list{
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px;
        width: 300px;
        border-radius: 6px;
        box-shadow: 0 0 12px ;
        backdrop-filter: blur(220px);
     }
     .n{
        display: flex;
        gap: 30px;
        align-items: center;
     }
     .n h3{
        font-size: 18px;
        color: rgb(25, 25, 108);
     }
     .cardshow h4{
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 20px;
        background: rgba(7, 7, 72, 0.374);
        padding: 10px;
        border-radius: 5px;
        color: #fff;
     }
    </style>
</head>
<body>
    <div class="profile">
        <div class="pro-info">
            <h1>Student Profile Card</h1>
            <p>Enter students details and create a profile using JavaScript objects</p>
        </div>
        <div class="card">
            <h2>Create Profile</h2>
            <div class="cre">
                <h3>Name</h3>
                <input class="name" type="text">
            </div>
             <div class="cre">
                <h3>Age</h3>
                <input class="age" type="number">
            </div>
             <div class="cre">
                <h3>Course</h3>
                <input class="cou" type="text">
            </div>
             <div class="cre">
                <h3>Email</h3>
                <input class="ema" type="email">
            </div>
             <div class="cre">
                <h3>Skill</h3>
                <input class="crt" type="text">
            </div>
        </div>
        <div class="buttons">
            <button class="create">Create Profile</button>
            <button class="clear">Clear</button>
        </div>
    </div>
    <div class="cardshow">
        <h4 class="and">&times;</h4>
        <div class="per">
            <h1>welcome</h1>
            <h2 id="wel"></h2>
        </div>
        <div class="list">
            <div class="n">
                <h3>Name:</h3>
                <p class="check1"></p>
            </div>
             <div class="n">
                <h3>Age:</h3>
                <p class="check2" ></p>
            </div>
             <div class="n">
                <h3>Course:</h3>
                <p class="check3" ></p>
            </div>
             <div class="n">
                <h3>Email:</h3>
                <p class="check4" ></p>
            </div>
             <div class="n">
                <h3>Skills:</h3>
                <p class="check5" ></p>
            </div>
        </div>
    </div>
    <script>
    
    let names=document.querySelector(".name");
     let age=document.querySelector(".age");
      let cou=document.querySelector(".cou");
       let ema=document.querySelector(".ema");
        let crt=document.querySelector(".crt");
         let create=document.querySelector(".create");
          let clear=document.querySelector(".clear");
          let check1=document.querySelector(".check1");
           let check2=document.querySelector(".check2");
            let check3=document.querySelector(".check3");
             let check4=document.querySelector(".check4");
              let check5=document.querySelector(".check5");
              let and=document.querySelector(".and");
              let cardshow=document.querySelector(".cardshow");
      let obj={};

     //create card button
     create.addEventListener("click",function(){
         
         obj.names=names.value;
         obj.age=Number(age.value);
         obj.cou=cou.value;
         obj.ea=ema.value;
         obj.cr=crt.value;
         
         console.log(obj);

         check1.textContent=obj.names;
          check2.textContent=obj.age;
           check3.textContent=obj.cou;
            check4.textContent=obj.ea;
             check5.textContent=obj.cr;
           
             cardshow.style.display="flex";
     });

        //all clear data
          clear.addEventListener("click",function(){
            obj={};
            names.value="";
             age.value="";
             cou.value="";
       ema.value="";
       cre.value="";
          })

          //clear card profile
          and.addEventListener("click",function(){
            cardshow.style.display="none";
          })
     

    </script>
</body>
</html>
