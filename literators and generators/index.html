<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Lazy Number Generator</h1>
        <p id="numberDisplay">Click Start to begin!</p>

        <button id="startBtn">Start Generator</button>
        <button id="nextBtn" disabled>Next Number</button>
        <button id="resetBtn">Reset</button>

        <p id="status"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
