<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shopping</title>
    <link rel="stylesheet" href="shop.css">

</head>
<body>
   
    
    <div class="shopping">
        <h1>🛒 My Cart</h1>
        <div class="card">
            <h2>Add Product</h2>
            <div class="pro">
                <input type="text" class="product" placeholder="Enter product Name.....">
                <input type="number" class="price" placeholder="Enter product Price.....">
            </div>
            <button class="add">Add to Cart</button>
            <div class="item">
                <h2>Cart Items</h2>
                <div class="list">
                    
                    
                </div>
               
                
                <div class="tot">
                    <h3 class="top">Total</h3>
                    <h3 class="cal">------</h3>
                </div>
                 <button class="clall">Clear All</button>
            </div>
           
        </div>
    </div>







    <script src="shop.js"></script>
</body>
</html>
