<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📦 Inventory Manager</h1>

        <form id="productForm">
            <input type="text" id="productId" placeholder="Product ID" required>
            <input type="text" id="productName" placeholder="Product Name" required>
            <input type="number" id="productPrice" placeholder="Price" min="0.01" step="0.01" required>
            <input type="text" id="productCategory" placeholder="Category" required>

            <button type="submit">Add Product</button>
        </form>

        <hr>

        <h2>Search Product</h2>
        <input type="text" id="searchId" placeholder="Enter Product ID">
        <button id="searchBtn">Search</button>



        <h3 id="toshow"></h3>
        <p id="searchResult"></p>

        <h2>Inventory</h2>
        <p>Total Products: <span id="productCount">0</span></p>

        <div id="productList"></div>

        <h2>Categories</h2>
         <p>Total Categories: <span id="catCount">0</span></p>
        <div id="categoryList"></div>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
