<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="reg.css">
</head>
<body>
    
  <div class="regis">
   <h1 class="reginfo">
    Create Account
   </h1>
   <p class="regp">
    Fill the details below to register.
   </p>

   <div class="form">
    <div class="fi">
        <div class="star">
            <h3>Name</h3>
            <p>*</p>
        </div>
       <div class="para">
        <input class="name" type="text">
        <p class="par">Name is required</p>  
    </div>
    </div>
     <div class="fi">
        <div class="star">
            <h3>Email</h3>
            <p>*</p>
        </div>
       <div class="para">
        <input class="email" type="email">
        <p class="par">Invalid email address</p>  
    </div>
    </div>
     <div class="fi">
        <div class="star">
            <h3>Password</h3>
            <p>*</p>
        </div>
       <div class="para">
        <input class="pass" type="password">
        <p class="par">Password must be at least 6 characters</p>  
    </div>
    </div>
     <div class="fi">
        <div class="star">
            <h3>Confirm Password</h3>
            <p>*</p>
        </div>
       <div class="para">
        <input class="conpass" type="password">
        <p class="par">Password do not match</p>  
    </div>
    </div>
     <div class="fi">
        <div class="star">
            <h3>Age</h3>
            <p>*</p>
        </div>
       <div class="para">
        <input class="age" type="number">
        <p class="par">You must be 18 or older</p>  
    </div>
    </div>
    <button class="but">Register</button>
    <div class="lainfo">
    <p class="lap">❗</p>
    <h3 class="laph3">Please Fix the errors before submitting</h3>
   </div>

   </div>
     
   

    
  </div>


    <script src="form.js"></script>
</body>
</html>
