<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorChangeBackground</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="color.css">
</head>
<body>
    

    <div class="color">
        <div class="color-info">
            <span><i class='bx bxs-palette'></i></span>
            <h1>Color Playground</h1>
        </div>
        <div class="side">
        <div class="left">
            <div class="star">
                <h2>Choose Color</h2>
                <select class="selectco">
                    <option>none</option>
                     <option>red</option>
                      <option>blue</option>
                       <option>lightgreen</option>
                        <option>orangered</option>
                </select>
                <button class="sa">Click</button>
            </div>
            <div class="colorname">
                <h2>Color Name</h2>
                <input type="text" class="input">
            </div>
            <button class="change">Change Color</button>
        </div>
        <div class="right">
            <h3>Move your mouse over me!</h3>
        </div>
        </div>
    </div>

    <script src="colorjs.js"></script>
</body>
</html>
