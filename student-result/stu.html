<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student_result</title>
    <link rel="stylesheet" href="stu.css">
</head>
<body>
    
    <div class="find">
        <input type="text" class="tofind" placeholder="Enter Student Name.....">
        <button class="go">Go</button>
        <div class="stuinfo">
      
            <div class="fiinfo">
                <h3>Name</h3>
                <h2 class="stuname"></h2>
            </div>
            
            <div class="fiinfo">
                <h3>Roll No</h3>
                <h2 class="sturoll"></h2>
            </div>
            
             <div class="fiinfo">
                <h3>Marks</h3>
                <h2 class="stumar"></h2>
            </div>
             <div class="fiinfo">
                <h3>status</h3>
                <h2 class="stusta"></h2>
            </div>
             <div class="fiinfo">
                <h3> no of Failed Subjects</h3>
                <h2 class="stufai"></h2>
            </div>
             <div class="fiinfo">
                <h3>no of passed Subjects</h3>
                <h2 class="stupas"></h2>
            </div>
            


        </div>
    </div>

    <div class="result">
        <div class="reslogo">
           <div class="info">
             <span>🧑‍🎓</span>
            <h1>All Students</h1>
           </div>
            <div class="inputs">
                 <input type="text" class="student" placeholder="Enter student name">
                 <input type="number" class="maths" placeholder="Maths">
                 <input type="number" class="science" placeholder="Science">
                 <input type="number" class="english" placeholder="English">
                
                <button class="add">Add</button>
            </div>
        </div>
        <div class="table">
            <div class="head">
                <h3 class="a">#</h3>
                <h3 class="b">Name</h3>
                <h3 class="c">Math</h3>
                <h3 class="d">Science</h3>
                <h3 class="e">English</h3>
                <h3 class="f">Total</h3>
                <h3 class="g">Average</h3>
                <h3 class="h">Status</h3>
            </div>
          
            <div class="doe">
           
                
            </div>
        </div>
    </div>

<div class="new">
   <div class="boxs">
    <span>👨‍💻</span>
    <div class="score">
        <h2>Total Students</h2>
        <h1 class="tostu">0</h1>
    </div>
   </div> 
    <div class="boxs a">
    <span>✓</span>
    <div class="score">
        <h2>passed Students</h2>
        <h1 class="passt">0</h1>
    </div>
   </div> 
    <div class="boxs b">
    <span>⨉</span>
    <div class="score">
        <h2>Failed Students</h2>
        <h1 class="faist">0</h1>
    </div>
   </div> 
    <div class="boxs c">
    <span>🏆</span>
    <div class="score">
        <h2>toppers</h2>
        <h1 class="topper">0</h1>
    </div>
   </div> 
</div>





    <script src="stu.js"></script>
</body>
</html>
