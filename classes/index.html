<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<header class="header">
    <h1>🚗 Vehicle Management System</h1>
    <p>Manage your cars and bikes in one place.</p>
</header>

<main class="container">

    <section class="form-section">
        <h2>Add a Vehicle</h2>

        <form id="vehicleForm">
            <label for="brand">Brand</label>
            <input type="text" id="brand" placeholder="e.g. Toyota" required>

            <label for="year">Year</label>
            <input type="number" id="year" placeholder="e.g. 2024" required>

            <label for="model">Model</label>
            <input type="text" id="model" placeholder="e.g. Camry" required>

            <label for="type">Vehicle Type</label>
            <select id="type" required>
                <option value="Car">Car</option>
                <option value="Bike">Bike</option>
            </select>

            <button type="submit">Add Vehicle</button>
        </form>
    </section>

    <section class="vehicles-section">
        <h2>My Vehicles</h2>
        <div id="vehicleList" class="vehicle-list">
            <p class="empty-message">No vehicles added yet.</p>
        </div>
    </section> 

</main>

<script src="script.js"></script>


</body>
</html>
