<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<div class="container">
    <header>
        <h1>Employee Management System</h1>
        <p>Manage employee details with JavaScript</p>
    </header>

    <section class="employee-section">
        <h2>Employee Details</h2>

        <div class="employee-grid">
            <div class="employee-card">
                <h3>Employee 1</h3>
                <p><strong>Name:</strong> Ravi</p>
                <p><strong>Role:</strong> Developer</p>
                <p><strong>Salary:</strong> ₹50,000</p>
                <button id="raviBtn">Show Details</button>
            </div>

            <div class="employee-card">
                <h3>Employee 2</h3>
                <p><strong>Name:</strong> Priya</p>
                <p><strong>Role:</strong> Designer</p>
                <p><strong>Salary:</strong> ₹60,000</p>
                <button id="priyaBtn">Show Details</button>
            </div>
        </div>
    </section>

    <section class="action-section">
        <h2>Employee Actions</h2>

        <div class="button-group">
            <button id="callBtn">Test call()</button>
            <button id="applyBtn">Test apply()</button>
            <button id="bindBtn">Test bind()</button>
        </div>
    </section>

    <section class="output-section">
        <h2>Output</h2>
        <div id="output">
            <p>Click a button to see employee details here.</p>
        </div>
    </section>
</div>

<script src="script.js"></script>


</body>
</html>
