<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet"  href="style.css">
</head>
<body>
    
 <div class="counting">
    <h1>Counting Numbers</h1>
    <h2 id="countnum">0</h2>

        <button id="addcount" class="countone">+</button>
         <button id="subcount" class="counttwo">-</button>
          <button id="restartcount" class="countthree">Repeat</button>
    </div>
    <button id="countingstart">Start Count</button>
 </div>



    <script src="javas.js"></script>
</body>
